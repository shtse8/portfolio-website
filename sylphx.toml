version = "1"

[project]
name = "portfolio-website"
slug = "portfolio-website"
org = "shtse8"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

[[domains]]
hostname = "kylet.se"
service = "web"

# The static site: keel pack's output served by nginx. The api service
# (api-rust and the on-site agent) was retired on 2026-09-28; nginx answers
# its old paths with 410.
[[services]]
name = "web"
port = 3000
watch_paths = ["site/**", "scenes/**", "Cargo.toml", "Cargo.lock", "KEEL_PIN", "scripts/**", "hosting/**", "nginx.conf", "Dockerfile", "sylphx.toml"]

[services.health]
mode = "http"
path = "/"
