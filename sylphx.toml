version = "1"

[project]
name = "portfolio-website"
slug = "portfolio-website"
org = "shtse8"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

# The image build reads the private Keel repository (SylphxAI/keel at
# KEEL_PIN) with a one-hour, read-only token minted from a GitHub App by the
# build pod (SylphxAI/cloud#9149). The project's KEEL_APP_ID and KEEL_APP_KEY
# secrets name that App; the value reaches only the Dockerfile's
# `--mount=type=secret,id=keel_git_token` step.
[build.secrets]
keel_git_token = { github_app = { app_id_secret = "KEEL_APP_ID", private_key_secret = "KEEL_APP_KEY", repositories = ["SylphxAI/keel"] } }

[[domains]]
hostname = "kylet.se"
service = "web"

# The static site: keel pack's output served by nginx. The api service
# (api-rust and the on-site agent) was retired on 2026-09-28; nginx answers
# its old paths with 410.
[[services]]
name = "web"
port = 3000
# nano (0.1 CPU, 256 MiB): 7-day p95 0.08 GiB, peak 0.08 GiB, CPU p95 0.001 (read 2026-10-04).
instance_type = "nano"
watch_paths = ["site/**", "scenes/**", "Cargo.toml", "Cargo.lock", "KEEL_PIN", ".cargo/**", "hosting/**", "nginx.conf", "Dockerfile", "sylphx.toml"]

[services.health]
mode = "http"
path = "/"
