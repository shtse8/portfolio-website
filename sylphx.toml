version = "1"

[project]
name = "portfolio-website"
slug = "portfolio-website"
org = "shtse8"

[build]
strategy = "dockerfile"
dockerfile = "Dockerfile"
context = "."

# Shared-domain edge routing (platform [[domains]] + service path_prefixes,
# same model as cubeage-platform): the edge (Envoy HTTPRoute) sends the api
# service's path prefixes straight to api:3001 and everything else to web.
# Once the push-intake pipeline projects this manifest, the nginx BFF proxy
# locations in nginx.conf become dead and can be removed (ADR-169 follow-up).
[[domains]]
hostname = "kylet.se"
service = "web"

[[domains]]
hostname = "kylet.se"
service = "api"

[[services]]
name = "web"
type = "web"
port = 3000
# Transitional until edge routing is live: nginx proxies /activity|/stats|/chat|/healthz → api:3001.
# Platform injects API_INTERNAL_URL and opens NetworkPolicy web→api.
connect = { services = ["api"] }
watch_paths = ["src/**", "public/**", "package.json", "nginx.conf", "Dockerfile", "sylphx.toml"]

[[services]]
name = "api"
type = "web"
port = 3001
deploy_priority = 100
# Shared-host path routing: the edge sends these prefixes directly to this
# service; web keeps catch-all `/` on kylet.se.
path_prefixes = ["/stats", "/activity", "/projects", "/recent", "/repo", "/downloads", "/chat", "/healthz"]
# Chat requires server-side env (project secrets): SYLPHX_AI_URL + SYLPHX_AI_API_KEY
# (or AI_GATEWAY_BASE_URL/AI_GATEWAY_KEY). SYLPHX_URL is the public browser URL and
# must never be used. Without a credential /chat fails closed with 503.
watch_paths = ["api-rust/**", "sylphx.toml"]
[services.build]
strategy = "dockerfile"
# Context MUST be repo root: api-rust/Dockerfile COPYs api-rust/src.
dockerfile = "api-rust/Dockerfile"
context = "."
[services.health]
mode = "http"
path = "/healthz"
