server {
    # Listen on the platform-provided $PORT (Sylphx injects PORT=3000). Substituted
    # at container start by nginx's envsubst entrypoint (NGINX_ENVSUBST_FILTER=PORT),
    # so only ${PORT} is replaced — nginx's own $uri/$host variables are untouched.
    listen ${PORT};
    root /usr/share/nginx/html;

    # Behind the platform gateway (TLS terminated upstream); emit relative redirects
    # so 301s resolve against the public https://kylet.se host, never leaking :${PORT}.
    absolute_redirect off;
    port_in_redirect off;

    # Legacy slug → renamed section. Server-side 301 (SEO-grade); the old /tech-stack
    # route is no longer generated, so this keeps shared links working.
    location = /tech-stack  { return 301 /capabilities/; }
    location = /tech-stack/ { return 301 /capabilities/; }

    # ── Same-origin BFF reverse proxy ──────────────────────────────────────
    # Browser talks only to this origin. Metrics authority is Control Plane via
    # the Rust API — never GitHub GraphQL from the browser, never CP URL/token
    # in frontend. In-cluster service DNS (same namespace):
    #   http://api:3001
    # Cluster-private FQDN (if SYLPHX_PRIVATE_DOMAIN pattern is wired):
    #   http://api.portfolio-website.sylphx.internal:3001
    # Prefer short service name for namespace-local web+api co-deploy.
    set $bff_upstream http://api:3001;

    location = /activity {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /stats {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /chat {
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming agent responses.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # Static export (trailingSlash: true). Resolve, in order: an exact file, a pretty
    # `.html`, then the directory's index.html (referenced explicitly so we don't depend
    # on directory-index resolution) — otherwise a real 404 (NOT an index.html SPA
    # fallback, so bogus paths return 404 instead of silently 200-ing as the home page).
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Styled 404 (Next.js `not-found` exported to 404.html), served with a 404 status.
    error_page 404 /404.html;

    # Cache hashed static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
