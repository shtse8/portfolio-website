# kylet.se: serves the keel pack (dist/web, Cloudflare Pages layout: /about
# is about.html). Redirects and per-file headers come from the pack's own
# _redirects and _headers (hosting/pack-rules.sh, run in the image build).
server {
    listen ${PORT};
    root /usr/share/nginx/html;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;
    charset utf-8;

    include /etc/nginx/snippets/headers.conf;

    # The retired API (api-rust and the on-site agent, removed 2026-09-28).
    location ~ ^/(stats|activity|projects|recent|repo|downloads|claims|healthz|chat)(/.*)?$ {
        include /etc/nginx/snippets/headers.conf;
        return 410;
    }

    include /etc/nginx/snippets/pack-rules.conf;

    # Site assets (logo, icons, poster) change rarely; revalidate after a day.
    location /assets/ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /assets/site.webmanifest {
        include /etc/nginx/snippets/headers.conf;
        default_type application/manifest+json;
    }

    location / {
        # Pages have no trailing slash (the pack's layout), as on Cloudflare Pages.
        rewrite ^(/.+)/$ $1 permanent;
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm text/xml application/xml image/svg+xml application/manifest+json;
}
