<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C0A0A"/>
      <stop offset="100%" stop-color="#7C2D12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 180) rotate(90) scale(420 420)">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- soft product geometry -->
  <g opacity="0.55">
    <rect x="860" y="140" width="260" height="180" rx="28" stroke="#FB923C" stroke-opacity="0.55" stroke-width="2" fill="#FB923C" fill-opacity="0.06"/>
    <rect x="940" y="260" width="240" height="170" rx="28" stroke="#FB923C" stroke-opacity="0.35" stroke-width="2" fill="none"/>
    <circle cx="1040" cy="320" r="110" stroke="#FB923C" stroke-opacity="0.25" stroke-width="2" fill="none"/>
    <circle cx="1040" cy="320" r="54" fill="#FB923C" fill-opacity="0.18"/>
  </g>

  <!-- monogram tile -->
  <rect x="80" y="96" width="96" height="96" rx="24" fill="#FB923C" fill-opacity="0.16" stroke="#FB923C" stroke-opacity="0.7" stroke-width="2"/>
  <text x="128" y="158" text-anchor="middle" fill="#FB923C" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700">CO</text>

  <text x="200" y="132" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">SylphxAI  ·  TypeScript</text>
  <text x="200" y="168" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">open source · social banner</text>

  <text x="80" y="320" fill="#FFF7ED" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="700">CodeRAG</text>
  <text x="80" y="380" fill="#CBD5E1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26">Semantic code search with AST chunking</text>

  <rect x="0" y="576" width="1280" height="64" fill="#000000" fill-opacity="0.28"/>
  <text x="80" y="615" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">github.com/SylphxAI/coderag</text>
  <circle cx="1200" cy="608" r="8" fill="#FB923C"/>
</svg>