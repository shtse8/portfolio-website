  <text x="180" y="150" fill="#64748b" fill-opacity="0.75"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">infra</text>

  <!-- Hairline under meta -->
  <rect x="72" y="210" width="72" height="2" rx="1" fill="#94a3b8" fill-opacity="0.55"/>

  <text x="72" y="340" fill="#f8fafc"
    font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="52" font-weight="700" letter-spacing="-0.03em">cluster API provider hetzner robot</text>
  <text x="72" y="392" fill="#64748b"
    font-family="ui-sans-serif, system-ui, sans-serif"
    font-size="22" font-weight="450">Cluster API Infrastructure Provider for Hetzner Robot bare metal — Talos-native (no clou</text>

  <!-- Floor bar -->
  <rect x="0" y="560" width="1280" height="80" fill="url(#floor)"/>
  <text x="72" y="608" fill="#64748b"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">github.com/SylphxAI/cluster-api-provider-hetzner-robot</text>
  <circle cx="1208" cy="604" r="6" fill="#94a3b8" fill-opacity="0.85"/>
