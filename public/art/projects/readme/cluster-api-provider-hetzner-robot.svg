<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none"><title>cluster-api-provider-hetzner-robot</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="640" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0d12"/>
      <stop offset="48%" stop-color="#151a24"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1020 220) rotate(70) scale(480 400)">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#cbd5e1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="70%">
