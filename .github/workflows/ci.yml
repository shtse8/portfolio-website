name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  # Fast Trunk: supersede obsolete runs for the same PR or branch tip.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-api:
    name: Rust API + differential (ADR-168)
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Enforce owned CI runner profiles
        run: python3 .github/scripts/check-owned-runner-profiles.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (prost-build)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Buf lint (proto SSOT)
        uses: bufbuild/buf-setup-action@v1
      - run: buf lint

      - name: Test api-rust (unit/contract/wiremock; skip differential spawn path)
        working-directory: api-rust
        run: cargo test --locked --jobs 1 -- --test-threads=1 --skip differential_matches_ts_oracle

      - name: No TS backend authority (ADR-168 S3)
        run: bash scripts/check-no-ts-backend.sh

      - name: Setup Bun (differential oracle)
        uses: oven-sh/setup-bun@v2

      - name: Differential parity (rej-010 portfolio backend caps)
        run: bash scripts/run-portfolio-differential.sh
