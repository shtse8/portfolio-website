name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (biome, tsc, tests, static export)
    # GitHub-hosted: this repo lives under a personal (User) GitHub account, and the
    # platform's JIT runner supply only mints runners into ORGANIZATION runner groups
    # (portfolio-website has no runner-group row). The `sylphx-linux-standard` label is
    # therefore unsatisfiable here: 0 of 971 jobs supplied in 7d, every run queued ~24h
    # and was auto-cancelled. Both jobs install their own toolchains, so a hosted image
    # is sufficient. Kyle's other personal repos already use `ubuntu-latest`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome check .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend tests (bun:test)
        run: bun test

      - name: Static export build
        run: bun run build

      - name: No TS backend authority (sole Rust API)
        run: bash scripts/check-no-ts-backend.sh

      - name: BFF upstream is api ksvc :80 (not Platform :3001)
        run: bash scripts/check-bff-upstream.sh

      - name: Design markers gate
        run: bun scripts/check-cinematic-markers.mjs

  api:
    name: Rust API (clippy, tests)
    # See the `web` job above: user-account repo, org-scoped runner supply.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Clippy (production code)
        working-directory: api-rust
        run: cargo clippy --locked --lib --bins -- -D warnings

      - name: Tests (unit, contract, wiremock)
        working-directory: api-rust
        run: cargo test --locked -- --test-threads=1
