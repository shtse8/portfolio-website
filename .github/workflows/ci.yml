name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
