name: CI

# Fast Trunk (Agent-native):
# - Aggregate source verdict: source-ci/pass
# - CI = source correctness only; Platform builds production once
# - Merge Queue off by default (no merge_group trigger)
# - Concurrency cancels superseded PR/branch tip runs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (biome, tsc, tests, static export)
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome check .

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Frontend tests (bun:test)
        run: bun test

      - name: Static export build
        run: bun run build

      - name: No TS backend authority (sole Rust API)
        run: bash scripts/check-no-ts-backend.sh

      - name: Design markers gate
        run: bun scripts/check-cinematic-markers.mjs

  api:
    name: Rust API (clippy, tests)
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy (production code)
        working-directory: api-rust
        run: cargo clippy --locked --lib --bins -- -D warnings

      - name: Tests (unit, contract, wiremock)
        working-directory: api-rust
        run: cargo test --locked -- --test-threads=1
