[package]
name = "kylet-api-rust"
version = "0.1.7"
edition = "2021"
rust-version = "1.75"
description = "Rust sole authority for kylet.se live API (stats, activity, projects, AI chat)"
license = "MIT"

[lib]
name = "kylet_api_rust"
path = "src/lib.rs"

[[bin]]
name = "kylet-api-rust"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
type_complexity = "allow"
