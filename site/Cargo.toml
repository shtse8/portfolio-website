[package]
name = "kylet-site"
description = "kylet.se, built with Keel Engine"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kylet-site"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = "1"
keel = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keel = { workspace = true, features = ["web-server"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
keel = { workspace = true, features = ["web-browser", "platform-web"] }
