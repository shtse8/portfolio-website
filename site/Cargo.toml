[package]
name = "kylet-site"
description = "kylet.se, built with Keel Engine"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kylet-site"
path = "src/main.rs"

[dependencies]
keel-math = { workspace = true }
keel-ui = { workspace = true }
keel-web = { workspace = true }
serde = { workspace = true }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keel-web = { workspace = true, features = ["server"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
keel-web = { workspace = true, features = ["browser"] }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "Window"] }
