[package]
name = "kylet-scenes"
description = "The live Keel scene on kylet.se"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kylet-scenes"
path = "src/main.rs"

[dependencies]
keel = { workspace = true, features = ["render-wgpu"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keel = { workspace = true, features = ["render-wgpu", "desktop-gpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"
keel = { workspace = true, features = ["web", "render-wgpu"] }
