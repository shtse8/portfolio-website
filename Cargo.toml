[workspace]
members = ["site", "scenes"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# The exact public Keel version. KEEL_PIN carries the same version for the CLI;
# scripts/check-keel-pin.sh keeps the dependency and build tools together.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# The same exact version Keel pins; the wasm-bindgen CLI that `keel pack` runs must match.
wasm-bindgen = "=0.2.130"
keel = { package = "sylphx-keel-engine", version = "=0.1.6097", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.release.package.kylet-scenes]
opt-level = 3
