syntax = "proto3";

package portfolio.v1;

// Cross-boundary contract SSOT for kylet-api-rust (ADR-168).
// REST handlers in api-rust mirror these messages; Connect codegen is the next slice.
service PortfolioApiService {
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  rpc ListRecent(ListRecentRequest) returns (ListRecentResponse);
  rpc GetDownloads(GetDownloadsRequest) returns (GetDownloadsResponse);
  // TICK038: contract coverage for live POST /chat + tool schemas
  rpc Chat(ChatRequest) returns (ChatResponse);
  rpc ListChatTools(ListChatToolsRequest) returns (ListChatToolsResponse);
}

message GetHealthRequest {}

message GetHealthResponse {
  string status = 1;
}

message GetStatsRequest {}

message GetStatsResponse {
  uint64 github_stars = 1;
  uint64 npm_downloads = 2;
  uint64 flagship_stars = 3;
  uint64 flagship_downloads = 4;
  map<string, uint64> by_owner = 5;
  uint64 repos = 6;
  string updated_at = 7;
}

message GetActivityRequest {}

message GetActivityResponse {
  uint64 commits_today = 1;
  uint64 commits_week = 2;
  uint64 commits_month = 3;
  uint64 repos_active_today = 4;
  LastPush last_push = 5;
  string updated_at = 6;
}

message LastPush {
  string repo = 1;
  string ago = 2;
}

message ListProjectsRequest {
  uint32 limit = 1;
}

message ListProjectsResponse {
  repeated RepoSummary projects = 1;
  string updated_at = 2;
}

message GetRepoRequest {
  string name = 1;
}

message GetRepoResponse {
  RepoSummary repo = 1;
  string updated_at = 2;
}

message ListRecentRequest {
  uint32 limit = 1;
}

message ListRecentResponse {
  repeated RepoSummary recent = 1;
  string updated_at = 2;
}

message GetDownloadsRequest {
  string pkg = 1;
}

message GetDownloadsResponse {
  string pkg = 1;
  repeated NpmDay series = 2;
  uint64 total = 3;
  string updated_at = 4;
}

message RepoSummary {
  string repo = 1;
  string name = 2;
  string owner = 3;
  uint64 stars = 4;
  uint64 forks = 5;
  optional string description = 6;
  optional string language = 7;
  repeated string topics = 8;
  optional string homepage = 9;
  string url = 10;
  string pushed = 11;
  string pushed_at = 12;
}

message NpmDay {
  string day = 1;
  uint64 downloads = 2;
}

message ChatRequest {
  // Opaque UI messages JSON (AI SDK UIMessage[]), mirrored by REST body.
  string messages_json = 1;
}

message ChatResponse {
  // SSE/stream is transport; unary response reserved for non-stream clients.
  string content = 1;
}

message ListChatToolsRequest {}

message ChatToolFunction {
  string name = 1;
  string description = 2;
  string parameters_json = 3;
}

message ListChatToolsResponse {
  repeated ChatToolFunction tools = 1;
}
