syntax = "proto3";

package portfolio.v1;

// Browser POST /chat body (REST projection of StreamChatRequest).
message StreamChatRequest {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string role = 1;
  repeated ChatPart parts = 2;
}

message ChatPart {
  string type = 1;
  string text = 2;
}

// Agent tool definitions (parity with retired Bun AGENT_TOOLS).
message AgentToolCatalog {
  repeated AgentToolDefinition tools = 1;
}

message AgentToolDefinition {
  string name = 1;
  string description = 2;
}
