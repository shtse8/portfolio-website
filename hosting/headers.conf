# Headers on every response. nginx drops server-level add_header lines in a
# location that adds its own, so each such location includes this file.
# keel pack's own headers (nosniff, the referrer policy, and the
# Content-Security-Policy with frame-ancestors; each page also carries its
# full policy in a meta tag) come from the pack's `_headers`.
include /etc/nginx/snippets/pack-headers.conf;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
