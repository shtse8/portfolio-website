# Headers on every response. nginx drops server-level add_header lines in a
# location that adds its own, so each such location includes this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# The site's policy, generated from the pack by csp.py in the image build and
# served here until keel-pack emits it (keel#3808).
include /etc/nginx/snippets/csp.conf;
